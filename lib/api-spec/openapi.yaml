        orderId:
          type: number
          minimum: 1
        rating:
          type: number
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 500
    ServiceReview:
      type: object
      required: [id, providerId, orderId, clientId, clientName, rating, comment, createdAt]
      properties:
        id:
          type: number
        providerId:
          type: number
        orderId:
          type: number
        clientId:
          type: string
        clientName:
          type: string
        rating:
          type: number
        comment:
          type: string
        createdAt:
          type: string
