        userId:
          type: string
        displayName:
          type: string
        bio:
          type: string
        city:
          type: string
        avatarUrl:
          type: ["string", "null"]
        verificationStatus:
          type: string
          enum: [unverified, pending, approved, rejected]
        verifiedAt:
          type: ["string", "null"]
          format: date-time
