        details:
          type: string
          maxLength: 1000
    SellerReportReceipt:
      type: object
      required: [id, status, createdAt]
      properties:
        id:
          type: number
        status:
          type: string
          enum: [pending]
        createdAt:
          type: string
          format: date-time
    FeedPost:
