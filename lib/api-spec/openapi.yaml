          minLength: 2
          maxLength: 80
        avatarUrl:
          type: string
          maxLength: 500
        shopName:
          type: string
          minLength: 2
          maxLength: 100
        shopDescription:
          type: string
          maxLength: 700
        bannerUrl:
          type: string
