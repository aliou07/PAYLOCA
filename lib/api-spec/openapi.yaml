        message:
          type: string
          minLength: 20
          maxLength: 1500
    JobApplicationStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [submitted, shortlisted, rejected]
    JobModerationInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [approved, rejected, closed]
